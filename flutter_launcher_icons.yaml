flutter_launcher_icons:
  # Icono legacy / iOS / fallback sin texto recortado
  image_path: "assets/icons/app_icon.png"

  # Android estándar (genera ic_launcher e ic_launcher_round)
  android: true
  min_sdk_android: 21

  # Configuración oficial de Adaptive Icons para Android 8.0+ (API 26+)
  adaptive_icon_background: "#072B4F"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0

  # Configuración para iOS
  ios: true
  remove_alpha_ios: true

  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
