name: atrio
description: "Vive tu Fe en comunidad"
publish_to: "none" # Evita que el paquete se publique accidentalmente en pub.dev
version: 0.1.0+23 # Versión semántica (0.1.0) y número de compilación interno (+23)

environment:
  sdk: ^3.13.0 # Versión mínima y compatible del SDK de Dart

# ==============================================================================
# DEPENDENCIAS DE PRODUCCIÓN (dependencies)
# Paquetes requeridos para la ejecución de la app en producción.
# ==============================================================================
dependencies:
  # ----------------------------------------------------------------------------
  # Framework Base & Localización Oficial (i18n / l10n)
  # ----------------------------------------------------------------------------
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter # Soporte oficial de Flutter para idiomas y formatos locales
  intl: ^0.20.3 # Formatos de fechas, monedas, números, mensajes ICU (plurales/géneros) y texto bidi

  # ----------------------------------------------------------------------------
  # Arquitectura & Gestión de Estado
  # ----------------------------------------------------------------------------
  provider: ^6.1.2 # Inyección de dependencias y reactividad mediante InheritedWidget (ChangeNotifierProvider)

  # ----------------------------------------------------------------------------
  # Red, HTTP & Conectividad
  # ----------------------------------------------------------------------------
  http: ^1.6.0 # Cliente HTTP para consumir APIs REST (autenticación, sync Odoo/backend, etc.)
  connectivity_plus: ^6.0.0 # Detecta el tipo de conexión de red del dispositivo (WiFi, móvil, ethernet, etc.)
  internet_connection_checker_plus: ^3.1.1 # Comprueba conectividad real a Internet con verificación de ping

  # ----------------------------------------------------------------------------
  # Autenticación e Identidad
  # ----------------------------------------------------------------------------
  google_sign_in: ^5.4.0 # Flujo de autenticación OAuth nativo con Google
  sign_in_with_apple: ^6.1.1 # Flujo de autenticación oficial con Apple ID (obligatorio en iOS)
  # flutter_facebook_auth: ^7.2.0 # (Opcional/Comentado) Autenticación con Facebook

  # ----------------------------------------------------------------------------
  # Almacenamiento Local & Base de Datos
  # ----------------------------------------------------------------------------
  sqflite: ^2.4.2 # Motor SQLite nativo para persistencia relacional local
  path: ^1.9.1 # Manipulación segura y multiplataforma de rutas de archivos y directorios
  shared_preferences: ^2.5.5 # Almacenamiento clave-valor simple para preferencias de usuario (modo oscuro, etc.)
  flutter_secure_storage: ^10.3.4 # Almacenamiento cifrado (Keychain en iOS, Keystore/EncryptedSharedPreferences en Android) para tokens y credenciales

  # ----------------------------------------------------------------------------
  # Geolocalización & Mapas
  # ----------------------------------------------------------------------------
  geolocator: ^14.0.3 # Obtención de coordenadas GPS, permisos de ubicación y rastreo de posición
  google_maps_flutter: ^2.18.0 # Widget principal para renderizar mapas interactivos de Google Maps
  google_maps_flutter_android: ^2.19.12 # Implementación específica y optimizaciones de Google Maps para Android
  google_maps_flutter_platform_interface: ^2.16.1 # Interfaz de plataforma base para el ecosistema Google Maps
  flutter_google_places_sdk: ^0.4.3 # SDK de Google Places para autocompletado y búsqueda de sitios/iglesias

  # ----------------------------------------------------------------------------
  # Multimedia: Audio, Video & Streaming
  # ----------------------------------------------------------------------------
  just_audio: ^0.10.6 # Reproductor de audio de alto rendimiento para transmisiones, podcasts y alabanzas
  just_audio_background: ^0.0.1-beta.17 # Soporte de audio en segundo plano con controles en la barra de notificaciones
  youtube_player_flutter: ^9.1.1 # Reproductor de videos y transmisiones en vivo de YouTube integrado en la app
  flutter_inappwebview_android: ^1.1.3 # Motor WebView para Android utilizado por componentes embebidos de video/web

  # ----------------------------------------------------------------------------
  # Interfaz Gráfica, Fuentes & Utilidades de UI
  # ----------------------------------------------------------------------------
  google_fonts: ^9.0.0 # Carga dinámica de tipografías desde Google Fonts sin empaquetar archivos ttf manuales
  font_awesome_flutter: ^11.0.0 # Biblioteca de iconos vectoriales FontAwesome
  image_picker: ^1.2.4 # Selector de imágenes desde galería o cámara del dispositivo (fotos de perfil, eventos, etc.)
  url_launcher: ^6.3.2 # Apertura de URLs externas, enlaces web, clientes de correo o llamadas telefónicas

  # ----------------------------------------------------------------------------
  # Diagnóstico, Información & Actualizaciones
  # ----------------------------------------------------------------------------
  csv: ^8.0.0 # Lector y escritor de archivos CSV (exportación/importación de datos o reportes)
  package_info_plus: ^10.2.2 # Consulta versión de la app, número de build y nombre del paquete en tiempo de ejecución
  upgrader: ^13.5.0 # Notifica y obliga a los usuarios a actualizar la app desde Google Play o App Store si hay una versión crítica
  feedback: ^3.1.1 # Herramienta interactiva para que los usuarios envíen reportes de errores con capturas de pantalla dibujables
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

# ==============================================================================
# DEPENDENCIAS DE DESARROLLO (dev_dependencies)
# Paquetes requeridos únicamente durante desarrollo, testing o generación de código.
# ==============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter # Framework oficial de tests unitarios, de widgets y mocks en Flutter
  flutter_lints: ^6.0.0 # Reglas de análisis estático recomendadas por el equipo de Flutter para código limpio
  build_runner: ^2.12.0 # Herramienta de compilación para ejecutar generadores de código de Dart
  flutter_native_splash: ^2.0.5 # CLI y generador automático de Splash Screens nativos (Android/iOS)
  flutter_launcher_icons: ^0.14.4 # CLI para generar todos los tamaños y formatos de iconos de la aplicación
  # flutter_gen_runner: ^5.3.2 # (Opcional - actualmente Flutter usa generate: true con l10n.yaml nativo)

# ==============================================================================
# CONFIGURACIÓN ESPECÍFICA DE FLUTTER
# ==============================================================================
flutter:
  uses-material-design: true # Habilita Material Design y la tipografía/iconografía estándar de Google
  generate: true # Activa la generación automática de código para localización (l10n.yaml -> AppLocalizations)

  # Carpetas de recursos locales empaquetados dentro de la aplicación
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/audio/
    - assets/json/
    - assets/database/

# ==============================================================================
# CONFIGURACIÓN DE HERRAMIENTAS CLI DE GENERACIÓN
# ==============================================================================

# Generación del icono de la aplicación (ejecutar: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 29 # Requisito del proyecto: Android 10 (API 29) o superior

# Generación de la pantalla de bienvenida nativa (ejecutar: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#42a5f5" # Color de fondo general del splash
  image: assets/images/splash-screen.png # Imagen centrada del splash
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover
  fullscreen: true

  # Configuración obligatoria y específica para la API de Splash de Android 12+
  android_12:
    color: "#42a5f5"
    image: assets/images/logo.png # Logo con dimensiones compatibles con el recorte circular de Android 12
    icon_background_color: "#111111"
